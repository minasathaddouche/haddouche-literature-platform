<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الثقافة الإسلامية | منصة بومدين حدوش للأدب والثقافة</title><meta name="description" content="نافذة الثقافة الإسلامية في منصة بومدين حدوش للأدب والثقافة: سيرة، فكر، قيم، وحضارة."><meta name="robots" content="index,follow"><link rel="stylesheet" href="../assets/style.css?v=20260929-islamic1"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة بومدين حدوش</strong><small>للأدب والثقافة</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">نافذة</div><h1>الثقافة الإسلامية</h1><p>سيرة، فكر، قيم، وحضارة — مواد موثقة تجمع بين المعرفة والتأمل والبعد الثقافي.</p><div id="category-results"></div></div></section><script>
const GENRE="islamic-culture";
fetch("../assets/articles.json").then(r=>r.json()).then(items=>{
 const list=items.filter(a=>(a.genres||[]).includes(GENRE));
 const box=document.getElementById("category-results");
 if(!list.length){box.innerHTML='<div class="empty-state">لا توجد مواد منشورة في هذا القسم بعد. ستظهر هنا تلقائيًا عند نشر أول مادة في الثقافة الإسلامية.</div>';return}
 box.innerHTML='<div class="grid">'+list.map(a=>'<a class="card" href="../articles/'+a.slug+'/index.html"><span class="tag">'+a.category+'</span><h3>'+a.title+'</h3><p>'+a.excerpt+'</p><div class="meta"><span>'+a.author+'</span></div></a>').join('')+'</div>';
});
</script></main><footer><div class="container"><div class="copyright">© 2026 منصة بومدين حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="../assets/site.js"></script></body></html>
