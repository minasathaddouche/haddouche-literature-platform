<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أدب الأطفال | منصة بومدين حدوش للأدب والثقافة</title><meta name="description" content="قسم أدب الأطفال: قصص وحكايات ونصوص أدبية وتربوية موجهة للأطفال والناشئة."><meta name="robots" content="index,follow"><link rel="stylesheet" href="../assets/style.css?v=20260927-childrenlit1"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة بومدين حدوش</strong><small>للأدب والثقافة</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">للطفل والناشئة</div><h1>أدب الأطفال</h1><p>فضاء للقصص والحكايات والنصوص الأدبية والتربوية الموجهة للأطفال والناشئة، يجمع بين المتعة والخيال والقيمة الإنسانية.</p><div id="category-results"></div></div></section><script>
const GENRE="children-literature";
fetch("../assets/articles.json?v=20260927-childrenlit1").then(r=>r.json()).then(items=>{
 const list=items.filter(a=>(a.genres||[]).includes(GENRE));
 const box=document.getElementById("category-results");
 if(!list.length){box.innerHTML='<div class="empty-state">لا توجد نصوص منشورة في قسم «أدب الأطفال» بعد. ستظهر هنا تلقائيًا عند نشر أول نص.</div>';return}
 box.innerHTML='<div class="grid">'+list.map(a=>'<a class="card" href="../articles/'+a.slug+'/index.html"><span class="tag">'+a.category+'</span><h3>'+a.title+'</h3><p>'+a.excerpt+'</p><div class="meta"><span>'+a.author+'</span>'+(a.date?'<span>•</span><span>'+a.date+'</span>':'')+'</div></a>').join('')+'</div>';
}).catch(()=>{document.getElementById("category-results").innerHTML='<div class="empty-state">تعذر تحميل النصوص مؤقتًا.</div>'});
</script></main><footer><div class="container"><div class="copyright">© 2026 منصة بومدين حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="../assets/site.js"></script></body></html>
