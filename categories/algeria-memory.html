<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>من ذاكرة الجزائر | منصة بومدين حدوش للأدب والثقافة</title><meta name="description" content="مقالات ووثائق وموضوعات في تاريخ الجزائر وذاكرتها الوطنية، من المقاومة والحركة الوطنية إلى ثورة التحرير وما بعدها."><meta name="robots" content="index,follow"><link rel="stylesheet" href="../assets/style.css?v=20260926-algeriamemory1"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة بومدين حدوش</strong><small>للأدب والثقافة</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">التاريخ والذاكرة الوطنية</div><h1>من ذاكرة الجزائر</h1><p>فضاء للموضوعات التاريخية والوثائق والشهادات التي تستعيد محطات من ذاكرة الجزائر، من المقاومة والحركة الوطنية إلى ثورة التحرير الوطني وما بعدها.</p><div id="category-results"></div></div></section><script>
const GENRE="algeria-memory";
fetch("../assets/articles.json?v=20260926-algeriamemory1").then(r=>r.json()).then(items=>{
 const list=items.filter(a=>(a.genres||[]).includes(GENRE));
 const box=document.getElementById("category-results");
 if(!list.length){box.innerHTML='<div class="empty-state">لا توجد مواد منشورة في هذا القسم بعد. ستظهر هنا تلقائيًا عند نشر أول مادة ضمن «من ذاكرة الجزائر».</div>';return}
 box.innerHTML='<div class="grid">'+list.map(a=>'<a class="card" href="../articles/'+a.slug+'/index.html"><span class="tag">'+a.category+'</span><h3>'+a.title+'</h3><p>'+a.excerpt+'</p><div class="meta"><span>'+a.author+'</span>'+(a.date?'<span>•</span><span>'+a.date+'</span>':'')+'</div></a>').join('')+'</div>';
}).catch(()=>{document.getElementById("category-results").innerHTML='<div class="empty-state">تعذر تحميل المواد مؤقتًا.</div>'});
</script></main><footer><div class="container"><div class="copyright">© 2026 منصة بومدين حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="../assets/site.js"></script></body></html>
